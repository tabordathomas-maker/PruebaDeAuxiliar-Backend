name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.14"
  POETRY_VERSION: "2.5.1"
  # Solo wheels ya construidos: ningún paquete ejecuta su setup.py al instalarse.
  POETRY_INSTALLER_ONLY_BINARY: ":all:"

jobs:
  lint:
    name: Estilo (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pipx install --pip-args="--only-binary=:all:" "poetry==${POETRY_VERSION}"
      - run: poetry install --no-interaction
      - run: poetry run invoke lint

  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pipx install --pip-args="--only-binary=:all:" "poetry==${POETRY_VERSION}"
      - run: poetry install --no-interaction
      # Postgres real con Docker Compose y un .env de claves aleatorias (`invoke db` lo
      # crea): las pruebas de contrato e integración no se omiten y no hay claves aquí.
      - run: poetry run invoke test
        if: always()

  build:
    name: Construcción de la imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear el .env con secretos aleatorios
        run: |
          cp .env.example .env
          for name in JWT_SECRET LIBRARIAN_PASSWORD ADMIN_PASSWORD POSTGRES_PASSWORD; do
            sed -i "s/^${name}=$/${name}=$(openssl rand -hex 32)/" .env
          done
      - name: Construir y levantar la API con Docker Compose
        run: docker compose up -d --build --wait
      - name: Comprobar que la API responde
        run: curl --fail --silent http://127.0.0.1:8000/
      - name: Registros de la API si algo falla
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
